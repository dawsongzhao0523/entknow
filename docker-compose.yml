# entKnow 本地开发/调试环境（一键：make infra / make app）
#
# 默认 profile：postgres / redis / minio（开发依赖，本地 go run / npm run dev 直连）
# app  profile：backend / prototype（容器化全栈，整体联调用）
#
# host 端口统一用 2+标准端口 段（25432/26379/29000/29001/28080/25188），避免与本机其他栈冲突；
# 仍冲突时用环境变量覆盖，如：POSTGRES_PORT=35432 docker compose up -d

name: entknow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: entknow
      POSTGRES_PASSWORD: entknow
      POSTGRES_DB: entknow
    ports:
      - "${POSTGRES_PORT:-25432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entknow -d entknow"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-26379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: entknow
      MINIO_ROOT_PASSWORD: entknow123
    ports:
      - "${MINIO_PORT:-29000}:9000"
      - "${MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10

  # 一次性任务：创建默认 bucket（幂等，可重复执行）
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 entknow entknow123
      && mc mb --ignore-existing local/entknow
      && echo 'minio bucket entknow ready'"

  backend:
    build: ./backend
    profiles: [app]
    ports:
      - "${BACKEND_PORT:-28080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prototype:
    build: ./prototype
    profiles: [app]
    ports:
      - "${PROTO_PORT:-25188}:80"

volumes:
  pgdata:
  redisdata:
  miniodata:
